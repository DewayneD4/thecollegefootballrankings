name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Token permission check via pages GET (404 means not enabled yet):"
          gh api repos/${{ github.repository }}/pages || true
          echo "Creating Pages site..."
          gh api --method POST repos/${{ github.repository }}/pages \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --input - <<'JSON'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          JSON
